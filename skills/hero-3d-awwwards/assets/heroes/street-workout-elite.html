<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geremías Samuel | Street Workout Elite</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap');
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        :root {
            --red-primary: #e63946;
            --red-dark: #9d0208;
            --red-glow: #ff1a1a;
            --black: #050505;
            --black-light: #0a0a0f;
            --white: #f1faee;
            --gray: #adb5bd;
        }
        
        body {
            font-family: 'Inter', system-ui, sans-serif;
            background: var(--black);
            color: var(--white);
            overflow-x: hidden;
            min-height: 100vh;
        }
        
        /* ===== HERO CONTAINER ===== */
        .hero {
            position: relative;
            width: 100%;
            min-height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        
        /* ===== CAPA 1: FONDO NEGRO PROFUNDO ===== */
        .bg-layer-1 {
            position: absolute;
            inset: 0;
            z-index: 1;
            background: radial-gradient(ellipse at 50% 20%, #1a0505 0%, #050505 50%, #000000 100%);
        }
        
        /* ===== CAPA 2: NEBULOSA ROJA LEJANA ===== */
        .bg-layer-2 {
            position: absolute;
            inset: -10%;
            z-index: 2;
            background:
                radial-gradient(ellipse 800px 500px at 70% 30%, rgba(157,2,8,0.4) 0%, transparent 70%),
                radial-gradient(ellipse 600px 400px at 30% 60%, rgba(230,57,70,0.25) 0%, transparent 70%),
                radial-gradient(ellipse 500px 300px at 80% 70%, rgba(255,26,26,0.2) 0%, transparent 70%);
            animation: nebulaDrift 20s ease-in-out infinite alternate;
        }
        
        @keyframes nebulaDrift {
            0% { transform: translate(0,0) scale(1); }
            100% { transform: translate(3%,-2%) scale(1.08); }
        }
        
        /* ===== CAPA 3: NUBES ROJAS MEDIAS ===== */
        .bg-layer-3 {
            position: absolute;
            inset: -5%;
            z-index: 3;
            opacity: 0.6;
            background:
                radial-gradient(ellipse 700px 350px at 20% 80%, rgba(157,2,8,0.35) 0%, transparent 70%),
                radial-gradient(ellipse 900px 450px at 60% 20%, rgba(230,57,70,0.2) 0%, transparent 70%),
                radial-gradient(ellipse 400px 300px at 90% 50%, rgba(255,26,26,0.15) 0%, transparent 70%);
            animation: cloudDrift 15s ease-in-out infinite alternate;
        }
        
        @keyframes cloudDrift {
            0% { transform: translate(0,0); }
            100% { transform: translate(-2%,1%); }
        }
        
        /* ===== CAPA 4: NUBES CERCANAS ===== */
        .bg-layer-4 {
            position: absolute;
            inset: -3%;
            z-index: 4;
            opacity: 0.4;
            background:
                radial-gradient(ellipse 500px 250px at 40% 90%, rgba(157,2,8,0.3) 0%, transparent 70%),
                radial-gradient(ellipse 600px 300px at 10% 40%, rgba(230,57,70,0.2) 0%, transparent 70%);
            animation: cloudDrift2 12s ease-in-out infinite alternate;
        }
        
        @keyframes cloudDrift2 {
            0% { transform: translate(0,0); }
            100% { transform: translate(1%,-1%); }
        }
        
        /* ===== CAPA 5: VIGNETTE ===== */
        .bg-layer-5 {
            position: absolute;
            inset: 0;
            z-index: 5;
            background: radial-gradient(ellipse at 50% 50%, transparent 30%, rgba(0,0,0,0.7) 100%);
            pointer-events: none;
        }
        
        /* ===== CAPA 6: CANVAS PARTICLES ===== */
        #particles-canvas {
            position: absolute;
            inset: 0;
            z-index: 6;
            pointer-events: none;
        }
        
        /* ===== CAPA 7: NOISE ===== */
        .noise {
            position: absolute;
            inset: 0;
            z-index: 7;
            opacity: 0.025;
            pointer-events: none;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
        }
        
        /* ===== NAVBAR ===== */
        .navbar {
            position: relative;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 1.5rem 3rem;
            width: 100%;
        }
        
        .nav-logo {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }
        
        .nav-logo-mark {
            width: 36px;
            height: 36px;
            border: 1.5px solid var(--red-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Oswald', sans-serif;
            font-weight: 700;
            font-size: 0.75rem;
            color: var(--red-primary);
            letter-spacing: 0.05em;
        }
        
        .nav-logo-text {
            font-family: 'Oswald', sans-serif;
            font-weight: 600;
            font-size: 0.85rem;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            color: var(--white);
        }
        
        .nav-links {
            display: flex;
            align-items: center;
            gap: 2.5rem;
            list-style: none;
        }
        
        .nav-links a {
            font-family: 'Oswald', sans-serif;
            font-weight: 400;
            font-size: 0.8rem;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--gray);
            text-decoration: none;
            transition: color 0.3s;
            position: relative;
        }
        
        .nav-links a:hover { color: var(--white); }
        
        .nav-links a .badge-count {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 18px;
            height: 18px;
            background: var(--red-primary);
            color: var(--white);
            border-radius: 50%;
            font-size: 0.6rem;
            font-weight: 700;
            margin-left: 6px;
            font-family: 'Inter', sans-serif;
        }
        
        .nav-lang {
            width: 32px;
            height: 32px;
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.7rem;
            font-weight: 600;
            color: var(--gray);
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .nav-lang:hover {
            border-color: var(--red-primary);
            color: var(--red-primary);
        }
        
        /* ===== HERO CONTENT ===== */
        .hero-content {
            position: relative;
            z-index: 50;
            flex: 1;
            display: grid;
            grid-template-columns: 1fr 1.2fr 1fr;
            align-items: center;
            padding: 0 3rem 3rem;
            gap: 2rem;
            max-width: 1600px;
            margin: 0 auto;
            width: 100%;
        }
        
        /* ===== LEFT COLUMN ===== */
        .hero-left {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            animation: fadeInLeft 1s cubic-bezier(0.16,1,0.3,1) 0.3s both;
        }
        
        @keyframes fadeInLeft {
            from { opacity: 0; transform: translateX(-40px); }
            to { opacity: 1; transform: translateX(0); }
        }
        
        .hero-name {
            font-family: 'Oswald', sans-serif;
            font-weight: 700;
            font-size: clamp(3rem, 7vw, 6.5rem);
            line-height: 0.95;
            text-transform: uppercase;
            letter-spacing: -0.02em;
        }
        
        .hero-name .name-1 {
            display: block;
            color: var(--white);
            text-shadow: 0 0 40px rgba(230,57,70,0.3);
        }
        
        .hero-name .name-2 {
            display: block;
            color: var(--red-primary);
            text-shadow: 0 0 60px rgba(230,57,70,0.5);
        }
        
        .hero-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 6px 20px;
            border: 1px solid rgba(230,57,70,0.5);
            color: var(--red-primary);
            font-family: 'Oswald', sans-serif;
            font-weight: 500;
            font-size: 0.85rem;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            width: fit-content;
            position: relative;
        }
        
        .hero-badge::before,
        .hero-badge::after {
            content: '';
            width: 4px;
            height: 4px;
            background: var(--red-primary);
            border-radius: 50%;
        }
        
        .hero-tagline {
            font-family: 'Inter', sans-serif;
            font-weight: 300;
            font-size: clamp(1.2rem, 2.5vw, 1.8rem);
            line-height: 1.3;
            color: var(--red-primary);
            opacity: 0.9;
            max-width: 320px;
        }
        
        .hero-cta {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            padding: 14px 32px;
            background: transparent;
            border: 1.5px solid var(--red-primary);
            color: var(--white);
            font-family: 'Oswald', sans-serif;
            font-weight: 600;
            font-size: 0.9rem;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.16,1,0.3,1);
            width: fit-content;
            position: relative;
            overflow: hidden;
        }
        
        .hero-cta::before {
            content: '';
            position: absolute;
            inset: 0;
            background: var(--red-primary);
            transform: translateX(-100%);
            transition: transform 0.4s cubic-bezier(0.16,1,0.3,1);
            z-index: -1;
        }
        
        .hero-cta:hover {
            color: var(--white);
            box-shadow: 0 0 30px rgba(230,57,70,0.4);
        }
        
        .hero-cta:hover::before {
            transform: translateX(0);
        }
        
        .hero-cta svg {
            transition: transform 0.3s;
        }
        
        .hero-cta:hover svg {
            transform: translateX(4px);
        }
        
        /* ===== STATS ===== */
        .hero-stats {
            display: flex;
            gap: 2.5rem;
            margin-top: 1rem;
        }
        
        .stat-item {
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
        }
        
        .stat-icon {
            width: 20px;
            height: 20px;
            color: var(--red-primary);
            margin-bottom: 0.25rem;
        }
        
        .stat-number {
            font-family: 'Oswald', sans-serif;
            font-weight: 700;
            font-size: 2.2rem;
            line-height: 1;
            color: var(--white);
        }
        
        .stat-label {
            font-size: 0.65rem;
            font-weight: 500;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--gray);
            line-height: 1.4;
            max-width: 80px;
        }
        
        /* ===== CENTER: ORBIT SYSTEM ===== */
        .hero-center {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 500px;
            animation: fadeInScale 1.2s cubic-bezier(0.16,1,0.3,1) 0.5s both;
        }
        
        @keyframes fadeInScale {
            from { opacity: 0; transform: scale(0.85); }
            to { opacity: 1; transform: scale(1); }
        }
        
        .orbit-system {
            position: relative;
            width: 500px;
            height: 500px;
        }
        
        /* Órbita exterior */
        .orbit-outer {
            position: absolute;
            inset: 0;
            border: 1px solid rgba(230,57,70,0.2);
            border-radius: 50%;
            animation: orbitRotate 30s linear infinite;
        }
        
        /* Órbita media */
        .orbit-mid {
            position: absolute;
            inset: 60px;
            border: 1px solid rgba(230,57,70,0.15);
            border-radius: 50%;
            animation: orbitRotate 20s linear infinite reverse;
        }
        
        /* Órbita interior */
        .orbit-inner {
            position: absolute;
            inset: 120px;
            border: 1px solid rgba(230,57,70,0.1);
            border-radius: 50%;
            animation: orbitRotate 15s linear infinite;
        }
        
        @keyframes orbitRotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        
        /* Planeta / Esfera */
        .planet {
            position: absolute;
            border-radius: 50%;
            overflow: hidden;
            box-shadow: 
                0 0 20px rgba(230,57,70,0.3),
                inset 0 0 20px rgba(0,0,0,0.5);
            transition: transform 0.4s, box-shadow 0.4s;
            cursor: pointer;
        }
        
        .planet:hover {
            transform: scale(1.15);
            box-shadow: 
                0 0 40px rgba(230,57,70,0.6),
                inset 0 0 20px rgba(0,0,0,0.3);
            z-index: 10;
        }
        
        .planet::after {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 50%;
            background: linear-gradient(135deg, rgba(255,255,255,0.15) 0%, transparent 50%, rgba(0,0,0,0.4) 100%);
            pointer-events: none;
        }
        
        .planet img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: saturate(0.8) contrast(1.1);
        }
        
        /* Planetas en órbita exterior */
        .p-outer-1 { width: 70px; height: 70px; top: -35px; left: 50%; transform: translateX(-50%); }
        .p-outer-2 { width: 55px; height: 55px; top: 15%; right: -27px; }
        .p-outer-3 { width: 60px; height: 60px; bottom: 15%; right: -30px; }
        .p-outer-4 { width: 50px; height: 50px; bottom: -25px; left: 50%; transform: translateX(-50%); }
        .p-outer-5 { width: 55px; height: 55px; bottom: 15%; left: -27px; }
        .p-outer-6 { width: 45px; height: 45px; top: 15%; left: -22px; }
        
        /* Planetas en órbita media */
        .p-mid-1 { width: 45px; height: 45px; top: -22px; left: 50%; transform: translateX(-50%); }
        .p-mid-2 { width: 40px; height: 40px; bottom: 10%; right: -20px; }
        .p-mid-3 { width: 42px; height: 42px; bottom: -21px; left: 50%; transform: translateX(-50%); }
        .p-mid-4 { width: 38px; height: 38px; top: 30%; left: -19px; }
        
        /* Esfera central */
        .central-sphere {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 220px;
            height: 220px;
            border-radius: 50%;
            overflow: hidden;
            box-shadow: 
                0 0 60px rgba(230,57,70,0.3),
                0 0 120px rgba(157,2,8,0.2),
                inset 0 0 60px rgba(0,0,0,0.4);
            z-index: 5;
            animation: sphereFloat 6s ease-in-out infinite;
        }
        
        @keyframes sphereFloat {
            0%, 100% { transform: translate(-50%, -50%) translateY(0); }
            50% { transform: translate(-50%, -50%) translateY(-10px); }
        }
        
        .central-sphere::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 50%;
            background: 
                radial-gradient(circle at 30% 30%, rgba(255,255,255,0.2) 0%, transparent 50%),
                radial-gradient(circle at 70% 70%, rgba(230,57,70,0.15) 0%, transparent 50%);
            z-index: 2;
            pointer-events: none;
        }
        
        .central-sphere::after {
            content: '';
            position: absolute;
            inset: -2px;
            border-radius: 50%;
            border: 2px solid rgba(230,57,70,0.3);
            box-shadow: 0 0 30px rgba(230,57,70,0.2);
            pointer-events: none;
        }
        
        .central-sphere img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: saturate(0.85) contrast(1.15);
        }
        
        /* Estrellas decorativas en la esfera central */
        .sphere-stars {
            position: absolute;
            inset: 0;
            z-index: 3;
            pointer-events: none;
        }
        
        .sphere-star {
            position: absolute;
            color: var(--red-primary);
            font-size: 10px;
            animation: starPulse 2s ease-in-out infinite;
        }
        
        .sphere-star:nth-child(1) { top: 20%; left: 25%; animation-delay: 0s; }
        .sphere-star:nth-child(2) { top: 35%; right: 20%; animation-delay: 0.3s; }
        .sphere-star:nth-child(3) { bottom: 30%; left: 30%; animation-delay: 0.6s; }
        .sphere-star:nth-child(4) { bottom: 20%; right: 25%; animation-delay: 0.9s; }
        .sphere-star:nth-child(5) { top: 50%; left: 15%; animation-delay: 1.2s; }
        .sphere-star:nth-child(6) { top: 15%; right: 35%; animation-delay: 1.5s; }
        
        @keyframes starPulse {
            0%, 100% { opacity: 0.4; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.3); }
        }
        
        /* ===== RIGHT COLUMN ===== */
        .hero-right {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 2.5rem;
            animation: fadeInRight 1s cubic-bezier(0.16,1,0.3,1) 0.6s both;
        }
        
        @keyframes fadeInRight {
            from { opacity: 0; transform: translateX(40px); }
            to { opacity: 1; transform: translateX(0); }
        }
        
        .trait {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.5rem;
            text-align: center;
        }
        
        .trait-icon {
            width: 36px;
            height: 36px;
            color: var(--red-primary);
            opacity: 0.8;
            transition: opacity 0.3s, transform 0.3s;
        }
        
        .trait:hover .trait-icon {
            opacity: 1;
            transform: scale(1.1);
        }
        
        .trait-label {
            font-size: 0.6rem;
            font-weight: 600;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: var(--gray);
        }
        
        /* ===== SOCIAL FLOAT ===== */
        .social-float {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            z-index: 100;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            animation: fadeInUp 1s cubic-bezier(0.16,1,0.3,1) 1s both;
        }
        
        .social-btn {
            width: 48px;
            height: 48px;
            background: linear-gradient(135deg, var(--red-primary), var(--red-dark));
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--white);
            text-decoration: none;
            transition: all 0.3s;
            position: relative;
            box-shadow: 0 4px 20px rgba(230,57,70,0.3);
        }
        
        .social-btn:nth-child(1) {
            clip-path: polygon(20% 0%, 100% 0%, 100% 80%, 80% 100%, 0% 100%, 0% 20%);
        }
        
        .social-btn:nth-child(2) {
            clip-path: polygon(0% 0%, 80% 0%, 100% 20%, 100% 100%, 20% 100%, 0% 80%);
            margin-top: -8px;
        }
        
        .social-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 6px 30px rgba(230,57,70,0.5);
        }
        
        /* ===== SCROLL INDICATOR ===== */
        .scroll-hint {
            position: absolute;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%);
            z-index: 50;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.5rem;
            opacity: 0.4;
            animation: fadeInUp 1s ease-out 1.5s both;
        }
        
        .scroll-hint svg {
            animation: bounce 2s ease-in-out infinite;
        }
        
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(8px); }
        }
        
        /* ===== RESPONSIVE ===== */
        @media (max-width: 1024px) {
            .hero-content {
                grid-template-columns: 1fr;
                text-align: center;
                padding: 2rem;
            }
            .hero-left { align-items: center; }
            .hero-tagline { max-width: 100%; }
            .hero-stats { justify-content: center; }
            .hero-right {
                flex-direction: row;
                justify-content: center;
                gap: 3rem;
            }
            .orbit-system { transform: scale(0.8); }
            .navbar { padding: 1rem 1.5rem; }
            .nav-links { display: none; }
        }
        
        @media (max-width: 640px) {
            .hero-name { font-size: 3rem; }
            .orbit-system { transform: scale(0.55); }
            .hero-stats { gap: 1.5rem; }
            .stat-number { font-size: 1.6rem; }
            .social-float { bottom: 1rem; right: 1rem; }
        }
        
        /* ===== MOUSE GLOW ===== */
        .mouse-glow {
            position: fixed;
            width: 500px;
            height: 500px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(230,57,70,0.08) 0%, transparent 70%);
            pointer-events: none;
            z-index: 8;
            transform: translate(-50%, -50%);
            transition: left 0.4s ease-out, top 0.4s ease-out;
        }
    </style>
</head>
<body>
    <div class="mouse-glow" id="mouseGlow"></div>
    
    <section class="hero" id="hero">
        <!-- Background Layers -->
        <div class="bg-layer-1" data-speed="0.01"></div>
        <div class="bg-layer-2" data-speed="0.03"></div>
        <div class="bg-layer-3" data-speed="0.06"></div>
        <div class="bg-layer-4" data-speed="0.1"></div>
        <div class="bg-layer-5"></div>
        <canvas id="particles-canvas"></canvas>
        <div class="noise"></div>
        
        <!-- Navbar -->
        <nav class="navbar">
            <div class="nav-logo">
                <div class="nav-logo-mark">GS</div>
                <div class="nav-logo-text">Geremías Samuel</div>
            </div>
            <ul class="nav-links">
                <li><a href="#perfil">Perfil</a></li>
                <li><a href="#skills">Skills</a></li>
                <li><a href="#programas">Programas <span class="badge-count">5</span></a></li>
                <li><a href="#agenda">Agenda</a></li>
                <li><a href="#contacto">Contacto</a></li>
            </ul>
            <div class="nav-lang">ES</div>
        </nav>
        
        <!-- Main Content -->
        <div class="hero-content">
            <!-- Left Column -->
            <div class="hero-left">
                <h1 class="hero-name">
                    <span class="name-1">Geremías</span>
                    <span class="name-2">Samuel</span>
                </h1>
                
                <div class="hero-badge">Elite</div>
                
                <p class="hero-tagline">La gravedad es solo una sugerencia.</p>
                
                <button class="hero-cta">
                    <span>Comienza el reto</span>

    <script>
        // ===== PARTICLES =====
        const canvas = document.getElementById('particles-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];
        
        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resize();
        window.addEventListener('resize', resize);
        
        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 2 + 0.3;
                this.speedX = (Math.random() - 0.5) * 0.3;
                this.speedY = (Math.random() - 0.5) * 0.3;
                this.alpha = Math.random() * 0.6 + 0.2;
                this.color = Math.random() > 0.7 ? '230, 57, 70' : '255, 100, 100';
            }
            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                if (this.x < 0 || this.x > canvas.width) this.speedX *= -1;
                if (this.y < 0 || this.y > canvas.height) this.speedY *= -1;
            }
            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(${this.color}, ${this.alpha})`;
                ctx.fill();
            }
        }
        
        const count = Math.min(100, Math.floor((canvas.width * canvas.height) / 12000));
        for (let i = 0; i < count; i++) particles.push(new Particle());
        
        function animateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => { p.update(); p.draw(); });
            requestAnimationFrame(animateParticles);
        }
        animateParticles();
        
        // ===== PARALLAX =====
        const hero = document.getElementById('hero');
        const parallaxLayers = hero.querySelectorAll('[data-speed]');
        let mx = 0, my = 0, cx = 0, cy = 0;
        
        document.addEventListener('mousemove', (e) => {
            mx = (e.clientX / window.innerWidth - 0.5) * 2;
            my = (e.clientY / window.innerHeight - 0.5) * 2;
        });
        
        function animateParallax() {
            cx += (mx - cx) * 0.04;
            cy += (my - cy) * 0.04;
            parallaxLayers.forEach(layer => {
                const speed = parseFloat(layer.dataset.speed);
                const x = cx * speed * 80;
                const y = cy * speed * 40;
                layer.style.transform = `translate(${x}px, ${y}px)`;
            });
            requestAnimationFrame(animateParallax);
        }
        animateParallax();
        
        // ===== MOUSE GLOW =====
        const glow = document.getElementById('mouseGlow');
        document.addEventListener('mousemove', (e) => {
            glow.style.left = e.clientX + 'px';
            glow.style.top = e.clientY + 'px';
        });
        
        // ===== COUNTER ANIMATION =====
        const counters = document.querySelectorAll('[data-count]');
        counters.forEach(counter => {
            const target = +counter.dataset.count;
            const duration = 2000;
            const increment = target / (duration / 16);
            let current = 0;
            
            const updateCounter = () => {
                current += increment;
                if (current < target) {
                    counter.textContent = Math.floor(current);
                    requestAnimationFrame(updateCounter);
                } else {
                    counter.textContent = target;
                }
            };
            setTimeout(updateCounter, 800);
        });
        
        // ===== ORBIT SYSTEM PARALLAX =====
        const orbitSystem = document.getElementById('orbitSystem');
        document.addEventListener('mousemove', (e) => {
            const rect = orbitSystem.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;
            const dx = (e.clientX - centerX) / rect.width;
            const dy = (e.clientY - centerY) / rect.height;
            orbitSystem.style.transform = `perspective(1000px) rotateY(${dx * 8}deg) rotateX(${-dy * 8}deg)`;
        });
    </script>
