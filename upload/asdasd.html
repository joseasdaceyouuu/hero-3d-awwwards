<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AETHER // QUANTUM CORE</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;700&family=Syne:wght@400;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #000000;
            --text: #ffffff;
            --accent: #00ffcc;
            --warning: #ff0055;
            --border: rgba(255, 255, 255, 0.15);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: var(--bg);
            color: var(--text);
            overflow: hidden;
            font-family: 'JetBrains Mono', monospace;
            height: 100vh;
            cursor: crosshair;
        }

        /* === WEBGL CANVAS === */
        #webgl-canvas {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 1;
        }

        /* === UI OVERLAY === */
        .ui-overlay {
            position: fixed;
            inset: 0;
            z-index: 10;
            pointer-events: none; /* Deja que el ratón atraviese la UI hacia el WebGL */
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 40px;
        }

        .ui-overlay * { pointer-events: auto; }

        /* === TOP HUD === */
        .top-hud {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }

        .system-id {
            border: 1px solid var(--border);
            padding: 15px 20px;
            background: rgba(0,0,0,0.3);
            backdrop-filter: blur(10px);
        }

        .system-id h3 { color: var(--accent); margin-bottom: 5px; font-weight: 700; }
        .system-id p { color: rgba(255,255,255,0.5); font-size: 0.7rem; }

        .telemetry {
            display: flex;
            gap: 30px;
        }

        .tel-item {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
        }
        .tel-label { font-size: 0.65rem; color: rgba(255,255,255,0.4); margin-bottom: 5px; }
        .tel-value { font-size: 1.2rem; font-weight: 700; color: var(--text); }
        .tel-value.warning { color: var(--warning); }
        .tel-value.active { color: var(--accent); }

        /* === CENTER TEXT === */
        .center-content {
            text-align: center;
            position: relative;
            z-index: 5;
        }
        
        .center-content::before {
            content: '';
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 600px; height: 600px;
            border: 1px solid rgba(0, 255, 204, 0.1);
            border-radius: 50%;
            z-index: -1;
            animation: pulse-ring 4s infinite;
        }

        @keyframes pulse-ring {
            0% { transform: translate(-50%, -50%) scale(0.8); opacity: 0; }
            50% { opacity: 1; }
            100% { transform: translate(-50%, -50%) scale(1.2); opacity: 0; }
        }

        h1 {
            font-family: 'Syne', sans-serif;
            font-size: clamp(2rem, 6vw, 5rem);
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: -0.04em;
            line-height: 0.9;
            text-shadow: 0 0 20px rgba(0,0,0,0.8);
        }

        .subtitle {
            margin-top: 20px;
            font-size: 0.9rem;
            color: var(--accent);
            letter-spacing: 0.3em;
            text-transform: uppercase;
        }

        /* === BOTTOM CONTROLS === */
        .bottom-controls {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
        }

        .instructions {
            font-size: 0.75rem;
            color: rgba(255,255,255,0.4);
            line-height: 1.6;
        }
        .instructions span { color: var(--accent); }

        .action-btn {
            background: transparent;
            border: 1px solid var(--accent);
            color: var(--accent);
            padding: 20px 40px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: color 0.3s;
        }

        .action-btn::before {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 100%; height: 100%;
            background: var(--accent);
            transition: left 0.3s cubic-bezier(0.16,1,0.3,1);
            z-index: -1;
        }

        .action-btn:hover { color: #000; }
        .action-btn:hover::before { left: 0; }

        /* === CORNER MARKERS === */
        .corner {
            position: fixed;
            width: 20px; height: 20px;
            border: 2px solid var(--accent);
            z-index: 20;
        }
        .tl { top: 20px; left: 20px; border-right: 0; border-bottom: 0; }
        .tr { top: 20px; right: 20px; border-left: 0; border-bottom: 0; }
        .bl { bottom: 20px; left: 20px; border-right: 0; border-top: 0; }
        .br { bottom: 20px; right: 20px; border-left: 0; border-top: 0; }

        /* === LOADING SCREEN === */
        #loader {
            position: fixed;
            inset: 0;
            background: #000;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            transition: opacity 1s;
        }
        #loader.hidden { opacity: 0; pointer-events: none; }
        .loader-text { font-size: 0.8rem; letter-spacing: 0.3em; color: var(--accent); margin-bottom: 20px; }
        .loader-bar { width: 300px; height: 2px; background: rgba(255,255,255,0.1); position: relative; overflow: hidden; }
        .loader-fill { position: absolute; top: 0; left: 0; height: 100%; width: 0%; background: var(--accent); animation: load 2s ease-in-out forwards; }
        @keyframes load { to { width: 100%; } }

    </style>
</head>
<body>

    <!-- LOADER -->
    <div id="loader">
        <div class="loader-text">INICIANDO NÚCLEO CUÁNTICO...</div>
        <div class="loader-bar"><div class="loader-fill"></div></div>
    </div>

    <!-- CORNER MARKERS -->
    <div class="corner tl"></div>
    <div class="corner tr"></div>
    <div class="corner bl"></div>
    <div class="corner br"></div>

    <!-- WEBGL CANVAS -->
    <canvas id="webgl-canvas"></canvas>

    <!-- UI OVERLAY -->
    <div class="ui-overlay">
        
        <!-- TOP HUD -->
        <header class="top-hud">
            <div class="system-id">
                <h3>AETHER OS v9.4</h3>
                <p>NODO: 0x4F9A2B1C // CONEXIÓN SEGURA</p>
            </div>
            <div class="telemetry">
                <div class="tel-item">
                    <span class="tel-label">Frecuencia</span>
                    <span class="tel-value active" id="freq-val">144.2 Hz</span>
                </div>
                <div class="tel-item">
                    <span class="tel-label">Carga GPU</span>
                    <span class="tel-value" id="gpu-val">64%</span>
                </div>
                <div class="tel-item">
                    <span class="tel-label">Estabilidad</span>
                    <span class="tel-value warning" id="stab-val">98.8%</span>
                </div>
            </div>
        </header>

        <!-- CENTER CONTENT -->
        <main class="center-content">
            <div class="subtitle">Protocolo de Sincronización Iniciado</div>
            <h1>Quantum<br>Resonance</h1>
        </main>

        <!-- BOTTOM CONTROLS -->
        <footer class="bottom-controls">
            <div class="instructions">
                [ <span>CLIC Y ARRASTRAR</span> ] PARA ROTAR NÚCLEO<br>
                [ <span>MOVER RATÓN</span> ] PARA DEFORMAR CAMPO MAGNÉTICO
            </div>
            <button class="action-btn" id="engageBtn">
                Iniciar Sincronización
            </button>
        </footer>
    </div>

    <!-- THREE.JL IMPORT MAP -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';

        // ===== SETUP =====
        const canvas = document.getElementById('webgl-canvas');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.z = 5;

        const renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

        // ===== CUSTOM SHADER MATERIAL (GLSL) =====
        // Simplex Noise en GLSL para deformar la geometría
        const simplexNoise = `
            vec3 mod289(vec3 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
            vec4 mod289(vec4 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
            vec4 permute(vec4 x) { return mod289(((x*34.0)+1.0)*x); }
            vec4 taylorInvSqrt(vec4 r) { return 1.79284291400159 - 0.85373472095314 * r; }
            float snoise(vec3 v) {
                const vec2 C = vec2(1.0/6.0, 1.0/3.0);
                const vec4 D = vec4(0.0, 0.5, 1.0, 2.0);
                vec3 i  = floor(v + dot(v, C.yyy));
                vec3 x0 = v - i + dot(i, C.xxx);
                vec3 g = step(x0.yzx, x0.xyz);
                vec3 l = 1.0 - g;
                vec3 i1 = min(g.xyz, l.zxy);
                vec3 i2 = max(g.xyz, l.zxy);
                vec3 x1 = x0 - i1 + C.xxx;
                vec3 x2 = x0 - i2 + C.yyy;
                vec3 x3 = x0 - D.yyy;
                i = mod289(i);
                vec4 p = permute(permute(permute(
                         i.z + vec4(0.0, i1.z, i2.z, 1.0))
                       + i.y + vec4(0.0, i1.y, i2.y, 1.0))
                       + i.x + vec4(0.0, i1.x, i2.x, 1.0));
                float n_ = 0.142857142857;
                vec3 ns = n_ * D.wyz - D.xzx;
                vec4 j = p - 49.0 * floor(p * ns.z * ns.z);
                vec4 x_ = floor(j * ns.z);
                vec4 y_ = floor(j - 7.0 * x_);
                vec4 x = x_ * ns.x + ns.yyyy;
                vec4 y = y_ * ns.x + ns.yyyy;
                vec4 h = 1.0 - abs(x) - abs(y);
                vec4 b0 = vec4(x.xy, y.xy);
                vec4 b1 = vec4(x.zw, y.zw);
                vec4 s0 = floor(b0)*2.0 + 1.0;
                vec4 s1 = floor(b1)*2.0 + 1.0;
                vec4 sh = -step(h, vec4(0.0));
                vec4 a0 = b0.xzyw + s0.xzyw*sh.xxyy;
                vec4 a1 = b1.xzyw + s1.xzyw*sh.zzww;
                vec3 p0 = vec3(a0.xy, h.x);
                vec3 p1 = vec3(a0.zw, h.y);
                vec3 p2 = vec3(a1.xy, h.z);
                vec3 p3 = vec3(a1.zw, h.w);
                vec4 norm = taylorInvSqrt(vec4(dot(p0,p0), dot(p1,p1), dot(p2, p2), dot(p3,p3)));
                p0 *= norm.x; p1 *= norm.y; p2 *= norm.z; p3 *= norm.w;
                vec4 m = max(0.6 - vec4(dot(x0,x0), dot(x1,x1), dot(x2,x2), dot(x3,x3)), 0.0);
                m = m * m;
                return 42.0 * dot(m*m, vec4(dot(p0,x0), dot(p1,x1), dot(p2,x2), dot(p3,x3)));
            }
        `;

        const coreMaterial = new THREE.ShaderMaterial({
            uniforms: {
                uTime: { value: 0 },
                uMouseForce: { value: 0 },
                uColorA: { value: new THREE.Color(0x00ffcc) }, // Cyan
                uColorB: { value: new THREE.Color(0xff0055) }  // Magenta
            },
            vertexShader: `
                uniform float uTime;
                uniform float uMouseForce;
                varying vec3 vNormal;
                varying vec3 vPosition;
                varying float vNoise;
                
                ${simplexNoise}

                void main() {
                    vec3 pos = position;
                    // Deformamos la esfera usando ruido simplex
                    float noiseScale = 1.5;
                    float noiseSpeed = uTime * 0.5;
                    float noise = snoise(pos * noiseScale + noiseSpeed);
                    
                    // El ratón aumenta la intensidad de la deformación
                    float displacement = noise * (0.3 + uMouseForce * 0.5);
                    pos += normal * displacement;
                    
                    vNormal = normalize(normalMatrix * normal);
                    vPosition = pos;
                    vNoise = noise;
                    
                    gl_Position = projectionMatrix * modelViewMatrix * vec4(pos, 1.0);
                }
            `,
            fragmentShader: `
                uniform vec3 uColorA;
                uniform vec3 uColorB;
                uniform float uTime;
                varying vec3 vNormal;
                varying vec3 vPosition;
                varying float vNoise;

                void main() {
                    // Efecto Fresnel (Brillo en los bordes)
                    vec3 viewDir = normalize(cameraPosition - vPosition);
                    float fresnel = pow(1.0 - dot(viewDir, vNormal), 2.0);
                    
                    // Mezcla de colores basada en el ruido
                    vec3 baseColor = mix(uColorB, uColorA, vNoise * 0.5 + 0.5);
                    
                    // Color final con brillo de borde
                    vec3 finalColor = baseColor + fresnel * uColorA * 1.5;
                    
                    gl_FragColor = vec4(finalColor, 1.0);
                }
            `,
            wireframe: false
        });

        // Geometría de alta resolución para que el shader se vea suave
        const coreGeometry = new THREE.IcosahedronGeometry(1.2, 40);
        const core = new THREE.Mesh(coreGeometry, coreMaterial);
        scene.add(core);

        // Wireframe externo (estética HUD)
        const wireGeometry = new THREE.IcosahedronGeometry(1.5, 1);
        const wireMaterial = new THREE.MeshBasicMaterial({ color: 0x00ffcc, wireframe: true, transparent: true, opacity: 0.1 });
        const wireframe = new THREE.Mesh(wireGeometry, wireMaterial);
        scene.add(wireframe);

        // ===== PARTÍCULAS =====
        const particleCount = 5000;
        const positions = new Float32Array(particleCount * 3);
        const colors = new Float32Array(particleCount * 3);

        for(let i = 0; i < particleCount; i++) {
            // Distribución esférica
            const radius = 2 + Math.random() * 3;
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.acos(2 * Math.random() - 1);

            positions[i*3] = radius * Math.sin(phi) * Math.cos(theta);
            positions[i*3+1] = radius * Math.sin(phi) * Math.sin(theta);
            positions[i*3+2] = radius * Math.cos(phi);

            // Colores cyan/magenta
            const mix = Math.random();
            colors[i*3] = mix > 0.5 ? 0.0 : 1.0;
            colors[i*3+1] = mix > 0.5 ? 1.0 : 0.0;
            colors[i*3+2] = mix > 0.5 ? 0.8 : 0.3;
        }

        const particleGeometry = new THREE.BufferGeometry();
        particleGeometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        particleGeometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

        const particleMaterial = new THREE.PointsMaterial({
            size: 0.015,
            vertexColors: true,
            transparent: true,
            opacity: 0.8,
            blending: THREE.AdditiveBlending
        });

        const particles = new THREE.Points(particleGeometry, particleMaterial);
        scene.add(particles);

        // ===== LUCES =====
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.2);
        scene.add(ambientLight);

        const pointLight1 = new THREE.PointLight(0x00ffcc, 2, 10);
        pointLight1.position.set(2, 2, 2);
        scene.add(pointLight1);

        const pointLight2 = new THREE.PointLight(0xff0055, 2, 10);
        pointLight2.position.set(-2, -2, -2);
        scene.add(pointLight2);

        // ===== INTERACCIÓN =====
        const mouse = new THREE.Vector2();
        let mouseForce = 0;
        let targetRotX = 0, targetRotY = 0;
        let currentRotX = 0, currentRotY = 0;
        let isDragging = false;
        let lastMouseX = 0, lastMouseY = 0;

        window.addEventListener('mousemove', (e) => {
            mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
            mouseForce = Math.min(1, mouseForce + 0.05); // Incrementa fuerza

            if (isDragging) {
                targetRotY += (e.clientX - lastMouseX) * 0.005;
                targetRotX += (e.clientY - lastMouseY) * 0.005;
                lastMouseX = e.clientX;
                lastMouseY = e.clientY;
            }
        });

        canvas.addEventListener('mousedown', (e) => {
            isDragging = true;
            lastMouseX = e.clientX;
            lastMouseY = e.clientY;
            canvas.style.cursor = 'grabbing';
        });
        window.addEventListener('mouseup', () => {
            isDragging = false;
            canvas.style.cursor = 'crosshair';
        });

        // ===== RESPONSIVE =====
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // ===== TELEMETRÍA HUD (Fake Data) =====
        const freqVal = document.getElementById('freq-val');
        const gpuVal = document.getElementById('gpu-val');
        const stabVal = document.getElementById('stab-val');

        setInterval(() => {
            const freq = (140 + Math.random() * 10).toFixed(1);
            const gpu = (60 + Math.random() * 20).toFixed(0);
            const stab = (98 + Math.random() * 1.9).toFixed(1);
            freqVal.innerText = `${freq} Hz`;
            gpuVal.innerText = `${gpu}%`;
            stabVal.innerText = `${stab}%`;
        }, 1500);

        // ===== ANIMATION LOOP =====
        const clock = new THREE.Clock();

        function animate() {
            const elapsedTime = clock.getElapsedTime();

            // Actualizar Uniforms del Shader
            coreMaterial.uniforms.uTime.value = elapsedTime;
            mouseForce *= 0.95; // Decae la fuerza del ratón
            coreMaterial.uniforms.uMouseForce.value = mouseForce;

            // Rotación suave del núcleo
            currentRotX += (targetRotX - currentRotX) * 0.05;
            currentRotY += (targetRotY - currentRotY) * 0.05;
            
            if(!isDragging) {
                targetRotY += 0.002; // Auto-rotación lenta
            }

            core.rotation.x = currentRotX;
            core.rotation.y = currentRotY;
            wireframe.rotation.x = currentRotX * 0.5;
            wireframe.rotation.y = currentRotY * 0.5;

            // Rotación de partículas
            particles.rotation.y = elapsedTime * 0.05;
            particles.rotation.x = elapsedTime * 0.02;

            // Parallax cámara
            camera.position.x += (mouse.x * 0.5 - camera.position.x) * 0.05;
            camera.position.y += (mouse.y * 0.5 - camera.position.y) * 0.05;
            camera.lookAt(0, 0, 0);

            renderer.render(scene, camera);
            requestAnimationFrame(animate);
        }

        // Ocultar loader después de 2s y empezar
        setTimeout(() => {
            document.getElementById('loader').classList.add('hidden');
            animate();
        }, 2000);

    </script>
</body>
</html>
